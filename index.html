<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ramo de Hot Wheels 🏎️💐</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    overflow: hidden;
    font-family: Arial, sans-serif;
    background:
        radial-gradient(circle at top, #ff9acb 0%, #17101c 55%, #050507 100%);
    color: white;
}

.pantalla {
    position: fixed;
    inset: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 25px;
}

.regalo {
    width: 100%;
    max-width: 420px;
    padding: 35px 22px;
    border-radius: 30px;
    background: rgba(255,255,255,0.10);
    border: 1px solid rgba(255,255,255,0.25);
    backdrop-filter: blur(12px);
    box-shadow: 0 0 40px rgba(255,80,170,0.35);
    animation: aparecer 1.2s ease;
}

.regalo h1 {
    font-size: 32px;
    margin-bottom: 12px;
}

.regalo p {
    font-size: 18px;
    opacity: .9;
}

.boton {
    margin-top: 25px;
    padding: 15px 30px;
    border: none;
    border-radius: 50px;
    background: linear-gradient(135deg, #ff1493, #ff69b4);
    color: white;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 8px 25px rgba(255,20,147,.45);
    transition: .2s;
}

.boton:active {
    transform: scale(.92);
}

#ramo {
    position: fixed;
    inset: 0;
    display: none;
    overflow: hidden;
}

.titulo {
    position: absolute;
    top: 35px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 27px;
    z-index: 10;
    animation: aparecer 1s ease;
}

.auto {
    position: absolute;
    width: 100px;
    height: 42px;
    border-radius: 18px 25px 12px 12px;
    background: linear-gradient(#ff5555, #9d0000);
    box-shadow: 0 8px 15px rgba(0,0,0,.5);
    opacity: 0;
}

.auto::before {
    content: "";
    position: absolute;
    width: 48px;
    height: 23px;
    top: -12px;
    left: 25px;
    border-radius: 15px 15px 3px 3px;
    background: #202020;
}

.auto::after {
    content: "🏎️";
    position: absolute;
    font-size: 42px;
    left: 29px;
    top: -5px;
}

.rueda {
    position: absolute;
    bottom: -8px;
    width: 20px;
    height: 20px;
    background: #050505;
    border: 4px solid #777;
    border-radius: 50%;
}

.r1 {
    left: 12px;
}

.r2 {
    right: 12px;
}

.auto1 {
    left: 8%;
    top: 30%;
    animation: entrar1 2s forwards 0.2s;
}

.auto2 {
    right: 8%;
    top: 38%;
    transform: rotate(180deg);
    animation: entrar2 2s forwards 0.5s;
}

.auto3 {
    left: 18%;
    top: 48%;
    animation: entrar3 2s forwards 0.8s;
}

.auto4 {
    right: 18%;
    top: 53%;
    transform: rotate(180deg);
    animation: entrar4 2s forwards 1.1s;
}

.auto5 {
    left: 35%;
    top: 57%;
    animation: entrar5 2s forwards 1.4s;
}

.auto6 {
    left: 5%;
    top: 63%;
    transform: rotate(180deg);
    animation: entrar6 2s forwards 1.7s;
}

.auto7 {
    right: 5%;
    top: 66%;
    animation: entrar7 2s forwards 2s;
}

.auto8 {
    left: 40%;
    top: 72%;
    transform: rotate(180deg);
    animation: entrar8 2s forwards 2.3s;
}

.mensaje {
    position: absolute;
    bottom: 25px;
    left: 20px;
    right: 20px;
    text-align: center;
    font-size: 19px;
    opacity: 0;
    animation: aparecer 1.5s forwards 3.5s;
}

.brillo {
    position: absolute;
    font-size: 22px;
    animation: brillar 1.5s infinite alternate;
}

.b1 { left: 15%; top: 18%; }
.b2 { right: 18%; top: 25%; animation-delay: .4s; }
.b3 { left: 12%; top: 75%; animation-delay: .8s; }
.b4 { right: 12%; top: 80%; animation-delay: 1s; }
.b5 { left: 48%; top: 15%; animation-delay: .6s; }

@keyframes entrar1 {
    from { transform: translateX(-150vw) rotate(-40deg); opacity: 0; }
    to { transform: translateX(0) rotate(-8deg); opacity: 1; }
}

@keyframes entrar2 {
    from { transform: translateX(150vw) rotate(180deg); opacity: 0; }
    to { transform: translateX(0) rotate(170deg); opacity: 1; }
}

@keyframes entrar3 {
    from { transform: translate(-150vw, 100vh) rotate(-80deg); opacity: 0; }
    to { transform: translate(0,0) rotate(12deg); opacity: 1; }
}

@keyframes entrar4 {
    from { transform: translate(150vw, 100vh) rotate(240deg); opacity: 0; }
    to { transform: translate(0,0) rotate(190deg); opacity: 1; }
}

@keyframes entrar5 {
    from { transform: translateY(100vh) rotate(80deg); opacity: 0; }
    to { transform: translateY(0) rotate(-5deg); opacity: 1; }
}

@keyframes entrar6 {
    from { transform: translateX(-150vw) rotate(-100deg); opacity: 0; }
    to { transform: translateX(0) rotate(15deg); opacity: 1; }
}

@keyframes entrar7 {
    from { transform: translateX(150vw) rotate(100deg); opacity: 0; }
    to { transform: translateX(0) rotate(-15deg); opacity: 1; }
}

@keyframes entrar8 {
    from { transform: translateY(100vh) rotate(180deg); opacity: 0; }
    to { transform: translateY(0) rotate(175deg); opacity: 1; }
}

@keyframes aparecer {
    from {
        opacity: 0;
        transform: scale(.8);
    }
    to {
        opacity: 1;
        transform: scale(1);
    }
}

@keyframes brillar {
    from {
        opacity: .3;
        transform: scale(.7) rotate(0deg);
    }
    to {
        opacity: 1;
        transform: scale(1.3) rotate(20deg);
    }
}

</style>
</head>

<body>

<div class="pantalla" id="inicio">

    <div class="regalo">

        <div style="font-size:70px;">🎁</div>

        <h1>Tengo algo preparado para ti...</h1>

        <p>
            Pero no es un regalo cualquiera 👀
        </p>

        <button class="boton" onclick="abrirRegalo()">
            Abrir regalo 💗
        </button>

    </div>

</div>


<div id="ramo">

    <div class="titulo">
        🏎️💐 Un ramo diferente 💐🏎️
    </div>

    <div class="brillo b1">✨</div>
    <div class="brillo b2">⭐</div>
    <div class="brillo b3">✨</div>
    <div class="brillo b4">💫</div>
    <div class="brillo b5">✨</div>


    <div class="auto auto1">
        <div class="rueda r1"></div>
        <div class="rueda r2"></div>
    </div>

    <div class="auto auto2">
        <div class="rueda r1"></div>
        <div class="rueda r2"></div>
    </div>

    <div class="auto auto3">
        <div class="rueda r1"></div>
        <div class="rueda r2"></div>
    </div>

    <div class="auto auto4">
        <div class="rueda r1"></div>
        <div class="rueda r2"></div>
    </div>

    <div class="auto auto5">
        <div class="rueda r1"></div>
        <div class="rueda r2"></div>
    </div>

    <div class="auto auto6">
        <div class="rueda r1"></div>
        <div class="rueda r2"></div>
    </div>

    <div class="auto auto7">
        <div class="rueda r1"></div>
        <div class="rueda r2"></div>
    </div>

    <div class="auto auto8">
        <div class="rueda r1"></div>
        <div class="rueda r2"></div>
    </div>


    <div class="mensaje">
        Porque unas flores eran demasiado normales para ti. ❤️
    </div>

</div>


<script>

function abrirRegalo() {

    document.getElementById("inicio").style.display = "none";

    document.getElementById("ramo").style.display = "block";

}

</script>

</body>
  </html>
